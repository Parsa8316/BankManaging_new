name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create Keystore and Base64
        run: |
          keytool -genkey -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-key-alias -storepass Purisa+8316 -keypass Purisa+8316 -dname "CN=Parsa, OU=Dev, O=App, L=Urmia, ST=WA, C=IR"
          base64 -w 0 release-key.jks > keystore_base64.txt

      - name: Upload Keystore Files
        uses: actions/upload-artifact@v4
        with:
          name: my-release-keystore
          path: |
            release-key.jks
            keystore_base64.txt
